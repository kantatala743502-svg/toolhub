<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number Generator - ToolHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 550px;
            width: 100%;
            padding: 40px;
        }
        .back-btn {
            display: inline-block; margin-bottom: 20px; color: #4facfe;
            text-decoration: none; font-weight: 600; font-size: 0.95rem;
        }
        .back-btn:hover { text-decoration: underline; }
        h1 { color: #1a1a2e; font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 25px; font-size: 0.95rem; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; color: #333; margin-bottom: 8px; font-size: 0.95rem; }
        input[type="number"] {
            width: 100%; padding: 14px 16px; border: 2px solid #e0e0e8; border-radius: 12px;
            font-size: 1rem; font-family: inherit; transition: border 0.3s;
        }
        input[type="number"]:focus { outline: none; border-color: #4facfe; }

        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: #4facfe; cursor: pointer; }
        .checkbox-group label { margin-bottom: 0; cursor: pointer; font-weight: 500; }

        button.main-btn {
            width: 100%; padding: 16px; background: linear-gradient(135deg, #84fab0, #8fd3f4);
            color: #fff; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 600;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
        }
        button.main-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(132,250,176,0.4); }
        button.main-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Result Area */
        .result-area {
            margin-top: 30px; background: #f8f9ff; border-radius: 16px; padding: 25px;
            text-align: center; border: 2px dashed #4facfe; display: none;
        }
        .result-area.show { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .result-title { font-size: 0.9rem; color: #888; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 1px; }
        
        .numbers-container {
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
        }
        .number-box {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
            padding: 12px 20px; border-radius: 10px; font-size: 1.5rem; font-weight: 800;
            min-width: 70px; box-shadow: 0 4px 10px rgba(102,126,234,0.3);
            transform: scale(0); animation: popIn 0.3s forwards;
        }
        @keyframes popIn { to { transform: scale(1); } }

        .copy-btn {
            margin-top: 20px; background: #fff; border: 2px solid #4facfe; color: #4facfe;
            padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .copy-btn:hover { background: #4facfe; color: #fff; }

        /* Spinning Animation Effect */
        .spinning .number-box {
            animation: spinPulse 0.15s infinite alternate;
        }
        @keyframes spinPulse { from { transform: scale(0.95); opacity: 0.7; } to { transform: scale(1.05); opacity: 1; } }

    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-btn">← Back to Tools</a>
        <h1>🎲 Random Number Generator</h1>
        <p class="subtitle">Generate random numbers for lottery, games, or selection</p>

        <div class="form-row">
            <div class="form-group">
                <label>Min Number:</label>
                <input type="number" id="minNum" value="1" min="0">
            </div>
            <div class="form-group">
                <label>Max Number:</label>
                <input type="number" id="maxNum" value="100">
            </div>
        </div>

        <div class="form-group">
            <label>How many numbers to generate?</label>
            <input type="number" id="quantity" value="1" min="1" max="50">
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="uniqueCheck" checked>
            <label for="uniqueCheck">Generate unique numbers (No duplicates)</label>
        </div>

        <button class="main-btn" id="generateBtn" onclick="generateNumbers()">Generate Numbers</button>

        <div class="result-area" id="resultArea">
            <div class="result-title">Generated Results</div>
            <div class="numbers-container" id="numbersContainer"></div>
            <button class="copy-btn" onclick="copyResults()">📋 Copy Results</button>
        </div>
    </div>

    <script>
        let generatedResults = [];

        function generateNumbers() {
            const min = parseInt(document.getElementById('minNum').value);
            const max = parseInt(document.getElementById('maxNum').value);
            const quantity = parseInt(document.getElementById('quantity').value);
            const unique = document.getElementById('uniqueCheck').checked;
            const resultArea = document.getElementById('resultArea');
            const container = document.getElementById('numbersContainer');
            const btn = document.getElementById('generateBtn');

            // Validation
            if (isNaN(min) || isNaN(max) || isNaN(quantity)) {
                alert('Please enter valid numbers!');
                return;
            }
            if (min > max) {
                alert('Min number cannot be greater than Max number!');
                return;
            }
            if (quantity < 1) {
                alert('Quantity must be at least 1!');
                return;
            }
            if (unique && quantity > (max - min + 1)) {
                alert(`Cannot generate ${quantity} unique numbers between ${min} and ${max}. Max possible is ${max - min + 1}.`);
                return;
            }

            // Hide previous results and show loading animation
            resultArea.classList.add('show');
            resultArea.classList.add('spinning');
            btn.disabled = true;
            container.innerHTML = '';
            
            // Create dummy placeholder boxes during spinning
            for(let i=0; i<quantity; i++) {
                let tempBox = document.createElement('div');
                tempBox.className = 'number-box';
                tempBox.style.transform = 'scale(1)';
                tempBox.textContent = '?';
                container.appendChild(tempBox);
            }

            // Simulate spinning delay (0.8 seconds)
            setTimeout(() => {
                generatedResults = [];
                let numbers = [];

                if (unique) {
                    // Fisher-Yates shuffle for unique numbers
                    let allPossible = [];
                    for (let i = min; i <= max; i++) allPossible.push(i);
                    
                    // Shuffle
                    for (let i = allPossible.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [allPossible[i], allPossible[j]] = [allPossible[j], allPossible[i]];
                    }
                    numbers = allPossible.slice(0, quantity);
                } else {
                    // Normal random with duplicates allowed
                    for (let i = 0; i < quantity; i++) {
                        numbers.push(Math.floor(Math.random() * (max - min + 1)) + min);
                    }
                }

                generatedResults = numbers;
                container.innerHTML = '';

                // Render final numbers
                numbers.forEach((num, index) => {
                    let box = document.createElement('div');
                    box.className = 'number-box';
                    box.textContent = num;
                    // Staggered animation delay
                    box.style.animationDelay = `${index * 0.1}s`;
                    container.appendChild(box);
                });

                resultArea.classList.remove('spinning');
                btn.disabled = false;

            }, 800); // 800ms spin time
        }

        function copyResults() {
            if (generatedResults.length === 0) return;
            
            const textToCopy = generatedResults.join(', ');
            navigator.clipboard.writeText(textToCopy).then(() => {
                const btn = document.querySelector('.copy-btn');
                const originalText = btn.textContent;
                btn.textContent = '✅ Copied!';
                btn.style.background = '#4facfe';
                btn.style.color = '#fff';
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '#fff';
                    btn.style.color = '#4facfe';
                }, 2000);
            });
        }
    </script>
</body>
</html>
