<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Tools - ToolHub</title>
    <!-- QRCode Library for WhatsApp QR -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 650px;
            width: 100%;
            padding: 40px;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #25d366;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .back-btn:hover { text-decoration: underline; }
        h1 { color: #1a1a2e; font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 0.95rem; }

        /* Tabs */
        .tabs {
            display: flex; gap: 5px; margin-bottom: 25px; border-bottom: 2px solid #e0e0e8;
            padding-bottom: 10px; overflow-x: auto;
        }
        .tab-btn {
            padding: 10px 15px; background: none; border: none; font-size: 0.95rem; font-weight: 600;
            color: #666; cursor: pointer; border-radius: 8px; transition: 0.3s; white-space: nowrap;
        }
        .tab-btn.active { background: #e8f8f0; color: #25d366; }
        .tab-btn:hover:not(.active) { background: #f8f9ff; }

        .tool-panel { display: none; animation: fadeIn 0.4s; }
        .tool-panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; color: #333; margin-bottom: 8px; font-size: 0.9rem; }
        input, textarea {
            width: 100%; padding: 12px 15px; border: 2px solid #e0e0e8; border-radius: 10px;
            font-size: 1rem; font-family: inherit; transition: border 0.3s;
        }
        textarea { resize: vertical; min-height: 80px; }
        input:focus, textarea:focus { outline: none; border-color: #25d366; }

        button.main-btn {
            width: 100%; padding: 15px; background: linear-gradient(135deg, #25d366, #128c7e);
            color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600;
            cursor: pointer; margin-top: 10px; transition: 0.2s;
        }
        button.main-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(37,211,102,0.4); }

        /* Result Box */
        .result { margin-top: 20px; padding: 15px; background: #f0fdf4; border-radius: 10px; border: 2px solid #25d366; display: none; word-break: break-all; }
        .result.show { display: block; }
        .result p { font-size: 0.9rem; color: #333; margin-bottom: 8px; }
        .link-text { font-size: 0.85rem; color: #25d366; font-weight: 600; background: #fff; padding: 10px; border-radius: 6px; display: block; border: 1px solid #c3e6cb; }
        .action-row { display: flex; gap: 10px; margin-top: 10px; }
        .action-row button { flex: 1; padding: 10px; font-size: 0.9rem; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; color: #fff; }
        .btn-copy { background: #128c7e; }
        .btn-open { background: #333; }

        /* QR Result */
        .qr-container { text-align: center; display: none; margin-top: 20px; padding: 20px; background: #f8f9ff; border-radius: 12px; }
        .qr-container.show { display: block; }
        #qrcode { display: inline-block; padding: 15px; background: #fff; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 15px; }
        #qrcode img, #qrcode canvas { display: block; }
        
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-btn">← Back to Tools</a>
        <h1>💬 WhatsApp Tools</h1>
        <p class="subtitle">Generate direct links, pre-filled messages, and QR codes</p>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('direct', event)">Direct Chat</button>
            <button class="tab-btn" onclick="switchTab('prefilled', event)">Pre-filled Message</button>
            <button class="tab-btn" onclick="switchTab('qr', event)">QR Code</button>
        </div>

        <!-- ================= DIRECT CHAT PANEL ================= -->
        <div class="tool-panel active" id="direct-panel">
            <div class="form-group">
                <label>Phone Number (with country code, no + or 0):</label>
                <input type="tel" id="directPhone" placeholder="e.g. 8801700000000">
            </div>
            <button class="main-btn" onclick="generateDirectLink()">Generate Direct Link</button>

            <div class="result" id="directResult">
                <p><strong>Your WhatsApp Link:</strong></p>
                <span class="link-text" id="directLinkDisplay"></span>
                <div class="action-row">
                    <button class="btn-copy" onclick="copyLink('directLinkDisplay')">📋 Copy Link</button>
                    <button class="btn-open" onclick="openLink('directLinkDisplay')">Open in WhatsApp</button>
                </div>
            </div>
        </div>

        <!-- ================= PRE-FILLED MESSAGE PANEL ================= -->
        <div class="tool-panel" id="prefilled-panel">
            <div class="form-group">
                <label>Phone Number (with country code):</label>
                <input type="tel" id="prefillPhone" placeholder="e.g. 8801700000000">
            </div>
            <div class="form-group">
                <label>Your Message:</label>
                <textarea id="prefillMessage" placeholder="Type the message you want to pre-fill..."></textarea>
            </div>
            <button class="main-btn" onclick="generatePrefilledLink()">Generate Link with Message</button>

            <div class="result" id="prefillResult">
                <p><strong>Your WhatsApp Link:</strong></p>
                <span class="link-text" id="prefillLinkDisplay"></span>
                <div class="action-row">
                    <button class="btn-copy" onclick="copyLink('prefillLinkDisplay')">📋 Copy Link</button>
                    <button class="btn-open" onclick="openLink('prefillLinkDisplay')">Open in WhatsApp</button>
                </div>
            </div>
        </div>

        <!-- ================= QR CODE PANEL ================= -->
        <div class="tool-panel" id="qr-panel">
            <div class="form-group">
                <label>Phone Number (with country code):</label>
                <input type="tel" id="qrPhone" placeholder="e.g. 8801700000000">
            </div>
            <button class="main-btn" onclick="generateQR()">Generate WhatsApp QR Code</button>

            <div class="qr-container" id="qrContainer">
                <div id="qrcode"></div>
                <br>
                <button class="main-btn" style="background: #43e97b;" onclick="downloadQR()">⬇️ Download QR Code</button>
            </div>
        </div>
    </div>

    <script>
        // Tab Switching Logic
        function switchTab(tabName, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tool-panel').forEach(panel => panel.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`${tabName}-panel`).classList.add('active');
        }

        // Helper Functions
        function copyLink(elementId) {
            const text = document.getElementById(elementId).textContent;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => alert('Link copied to clipboard!'));
        }

        function openLink(elementId) {
            const text = document.getElementById(elementId).textContent;
            if (text) window.open(text, '_blank');
        }

        // ==========================================
        // 1. DIRECT CHAT
        // ==========================================
        function generateDirectLink() {
            const phone = document.getElementById('directPhone').value.replace(/\D/g, '');
            if (!phone) { alert('Please enter a phone number!'); return; }

            const link = `https://wa.me/${phone}`;
            document.getElementById('directLinkDisplay').textContent = link;
            document.getElementById('directResult').classList.add('show');
        }

        // ==========================================
        // 2. PRE-FILLED MESSAGE
        // ==========================================
        function generatePrefilledLink() {
            const phone = document.getElementById('prefillPhone').value.replace(/\D/g, '');
            const message = document.getElementById('prefillMessage').value.trim();

            if (!phone) { alert('Please enter a phone number!'); return; }

            const encodedMsg = encodeURIComponent(message);
            const link = `https://wa.me/${phone}${message ? '?text=' + encodedMsg : ''}`;
            
            document.getElementById('prefillLinkDisplay').textContent = link;
            document.getElementById('prefillResult').classList.add('show');
        }

        // ==========================================
        // 3. QR CODE
        // ==========================================
        function generateQR() {
            const phone = document.getElementById('qrPhone').value.replace(/\D/g, '');
            if (!phone) { alert('Please enter a phone number!'); return; }

            const link = `https://wa.me/${phone}`;
            const qrDiv = document.getElementById('qrcode');
            qrDiv.innerHTML = ''; // Clear previous

            new QRCode(qrDiv, {
                text: link,
                width: 200,
                height: 200,
                colorDark: '#128c7e', // WhatsApp dark green
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
            });

            document.getElementById('qrContainer').classList.add('show');
        }

        function downloadQR() {
            const canvas = document.querySelector('#qrcode canvas');
            if (!canvas) return;

            const url = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = `WhatsApp_QR_${Date.now()}.png`;
            link.href = url;
            link.click();
        }
    </script>
</body>
</html>
