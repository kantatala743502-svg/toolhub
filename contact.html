<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ToolHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9ff;
            color: #333;
            line-height: 1.7;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .back-btn:hover { text-decoration: underline; }
        h1 { color: #1a1a2e; font-size: 2.2rem; margin-bottom: 10px; text-align: center; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 1.05rem; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; color: #333; margin-bottom: 8px; font-size: 0.95rem; }
        input, textarea {
            width: 100%; padding: 14px 16px; border: 2px solid #e0e0e8; border-radius: 12px;
            font-size: 1rem; font-family: inherit; transition: border 0.3s; background: #f8f9ff;
        }
        input:focus, textarea:focus { outline: none; border-color: #667eea; background: #fff; }
        textarea { resize: vertical; min-height: 120px; }

        button.main-btn {
            width: 100%; padding: 16px; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border: none; border-radius: 12px; font-size: 1.05rem; font-weight: 600;
            cursor: pointer; transition: 0.2s;
        }
        button.main-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }

        .contact-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e8;
            text-align: center;
        }
        .contact-info p { color: #666; font-size: 0.95rem; margin-bottom: 10px; }
        .contact-info strong { color: #1a1a2e; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-btn">← Back to Home</a>
        <h1>Contact Us</h1>
        <p class="subtitle">Have a question or feedback? We'd love to hear from you!</p>

        <form action="https://formsubmit.co/your-email@example.com" method="POST">
            <!-- FormSubmit Configuration -->
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">
            
            <div class="form-group">
                <label>Your Name:</label>
                <input type="text" name="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Your Email:</label>
                <input type="email" name="email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Subject:</label>
                <input type="text" name="subject" required placeholder="How can we help you?">
            </div>
            <div class="form-group">
                <label>Message:</label>
                <textarea name="message" required placeholder="Write your message here..."></textarea>
            </div>
            <button type="submit" class="main-btn">📩 Send Message</button>
        </form>

        <div class="contact-info">
            <p>Or email us directly at:</p>
            <p>📧 <strong>your-email@example.com</strong></p>
            <p style="font-size: 0.85rem; color: #888; margin-top: 15px;">We usually reply within 24-48 hours.</p>
        </div>
    </div>
</body>
</html>
