<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Password Generator - ToolHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 550px;
            width: 100%;
            padding: 40px;
        }
        .back-btn {
            display: inline-block; margin-bottom: 20px; color: #667eea;
            text-decoration: none; font-weight: 600; font-size: 0.95rem;
        }
        .back-btn:hover { text-decoration: underline; }
        h1 { color: #1a1a2e; font-size: 1.8rem; margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 25px; font-size: 0.95rem; }

        /* Mode Toggle */
        .mode-toggle {
            display: flex; background: #f0f0f5; border-radius: 10px; padding: 5px; margin-bottom: 20px;
        }
        .mode-btn {
            flex: 1; padding: 10px; border: none; background: none; font-weight: 600;
            color: #666; cursor: pointer; border-radius: 8px; transition: 0.3s;
        }
        .mode-btn.active { background: #fff; color: #667eea; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* Output Box */
        .password-box {
            background: #f8f9ff; border: 2px dashed #c0c0d0; border-radius: 12px;
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; transition: 0.3s;
        }
        .password-box:hover { border-color: #667eea; }
        #passwordOutput {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem; font-weight: 700; color: #1a1a2e;
            word-break: break-all; user-select: all;
        }
        .copy-btn {
            background: #667eea; color: #fff; border: none; padding: 10px 15px;
            border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: 0.2s;
            white-space: nowrap; margin-left: 10px;
        }
        .copy-btn:hover { background: #5568d3; }
        .copy-btn.copied { background: #43e97b; }

        /* Strength Meter */
        .strength-meter { display: flex; gap: 5px; margin-bottom: 5px; }
        .strength-bar {
            flex: 1; height: 6px; background: #e0e0e8; border-radius: 10px; transition: 0.3s;
        }
        .strength-bar.active-weak { background: #f5576c; }
        .strength-bar.active-medium { background: #f5a623; }
        .strength-bar.active-strong { background: #43e97b; }
        .strength-text { font-size: 0.85rem; color: #666; text-align: right; margin-bottom: 20px; font-weight: 600; }

        /* Settings */
        .form-group { margin-bottom: 20px; }
        label { display: flex; justify-content: space-between; font-weight: 600; color: #333; margin-bottom: 10px; font-size: 0.95rem; }
        .length-value { background: #667eea; color: #fff; padding: 2px 10px; border-radius: 20px; font-size: 0.85rem; }
        input[type="range"] { width: 100%; accent-color: #667eea; cursor: pointer; }
        
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: #667eea; cursor: pointer; }
        .checkbox-group label { margin-bottom: 0; cursor: pointer; font-weight: 500; color: #555; }

        /* Word Mode Options */
        #wordOptions { display: none; }

        button.generate-btn {
            width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border: none; border-radius: 12px; font-size: 1.05rem; font-weight: 600;
            cursor: pointer; transition: 0.2s; margin-top: 10px;
        }
        button.generate-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }

    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-btn">← Back to Tools</a>
        <h1>🔐 Advanced Password Generator</h1>
        <p class="subtitle">Create strong, random, and secure passwords</p>

        <!-- Mode Toggle -->
        <div class="mode-toggle">
            <button class="mode-btn active" id="modeRandom" onclick="switchMode('random')">Random Characters</button>
            <button class="mode-btn" id="modeWords" onclick="switchMode('words')">Passphrase (Easy to remember)</button>
        </div>

        <!-- Output -->
        <div class="password-box">
            <span id="passwordOutput">Click Generate</span>
            <button class="copy-btn" id="copyBtn" onclick="copyPassword()">📋 Copy</button>
        </div>

        <!-- Strength -->
        <div class="strength-meter" id="strengthMeter">
            <div class="strength-bar"></div>
            <div class="strength-bar"></div>
            <div class="strength-bar"></div>
            <div class="strength-bar"></div>
        </div>
        <div class="strength-text" id="strengthText">Strength: -</div>

        <!-- Settings (Random Mode) -->
        <div id="randomOptions">
            <div class="form-group">
                <label>Password Length: <span class="length-value" id="lengthValue">16</span></label>
                <input type="range" id="lengthSlider" min="6" max="50" value="16" oninput="updateLengthLabel()">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="includeUppercase" checked onchange="generatePassword()">
                <label for="includeUppercase">Include Uppercase Letters (A-Z)</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="includeLowercase" checked onchange="generatePassword()">
                <label for="includeLowercase">Include Lowercase Letters (a-z)</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="includeNumbers" checked onchange="generatePassword()">
                <label for="includeNumbers">Include Numbers (0-9)</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="includeSymbols" checked onchange="generatePassword()">
                <label for="includeSymbols">Include Symbols (!@#$%^&*)</label>
            </div>
            
            <!-- New Feature: Exclude Ambiguous -->
            <div class="checkbox-group" style="margin-top: 15px; border-top: 1px solid #e0e0e8; padding-top: 15px;">
                <input type="checkbox" id="excludeAmbiguous" onchange="generatePassword()">
                <label for="excludeAmbiguous">Exclude Ambiguous Characters (l, 1, O, 0)</label>
            </div>
        </div>

        <!-- Settings (Word Mode) -->
        <div id="wordOptions">
            <div class="form-group">
                <label>Number of Words: <span class="length-value" id="wordCountValue">4</span></label>
                <input type="range" id="wordCountSlider" min="3" max="8" value="4" oninput="updateWordCountLabel()">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="addNumberToWords" checked onchange="generatePassword()">
                <label for="addNumberToWords">Append Random Number at the end</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="capitalizeWords" checked onchange="generatePassword()">
                <label for="capitalizeWords">Capitalize each word</label>
            </div>
        </div>

        <button class="generate-btn" onclick="generatePassword()">Generate Password</button>
    </div>

    <script>
        const passwordOutput = document.getElementById('passwordOutput');
        const copyBtn = document.getElementById('copyBtn');
        const strengthBars = document.querySelectorAll('.strength-bar');
        const strengthText = document.getElementById('strengthText');
        
        // Mode State
        let currentMode = 'random';

        // Word List for Passphrase
        const wordList = [
            "apple", "brave", "crane", "dragon", "eagle", "flame", "giant", "horse", 
            "igloo", "joker", "knife", "lemon", "mouse", "night", "ocean", "panda", 
            "queen", "river", "snake", "tiger", "uncle", "voice", "whale", "xenon", 
            "yacht", "zebra", "stone", "plant", "cloud", "light", "dark", "speed", 
            "music", "dream", "magic", "force", "power", "storm", "earth", "water", 
            "fire", "wind", "heart", "soul", "mind", "body", "star", "moon", "sun"
        ];

        const chars = {
            upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            lower: 'abcdefghijklmnopqrstuvwxyz',
            number: '0123456789',
            symbol: '!@#$%^&*()_+~`|}{[]:;?><,./-='
        };

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('modeRandom').classList.toggle('active', mode === 'random');
            document.getElementById('modeWords').classList.toggle('active', mode === 'words');
            document.getElementById('randomOptions').style.display = mode === 'random' ? 'block' : 'none';
            document.getElementById('wordOptions').style.display = mode === 'words' ? 'block' : 'none';
            generatePassword();
        }

        function updateLengthLabel() {
            document.getElementById('lengthValue').textContent = document.getElementById('lengthSlider').value;
            generatePassword();
        }

        function updateWordCountLabel() {
            document.getElementById('wordCountValue').textContent = document.getElementById('wordCountSlider').value;
            generatePassword();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function generatePassword() {
            if (currentMode === 'random') {
                generateRandomPassword();
            } else {
                generatePassphrase();
            }
        }

        // ==========================================
        // MODE 1: RANDOM CHARACTERS
        // ==========================================
        function generateRandomPassword() {
            const length = parseInt(document.getElementById('lengthSlider').value);
            const incUpper = document.getElementById('includeUppercase').checked;
            const incLower = document.getElementById('includeLowercase').checked;
            const incNumber = document.getElementById('includeNumbers').checked;
            const incSymbol = document.getElementById('includeSymbols').checked;
            const excludeAmbiguous = document.getElementById('excludeAmbiguous').checked;

            let upperChars = chars.upper;
            let lowerChars = chars.lower;
            let numberChars = chars.number;
            let symbolChars = chars.symbol;

            // Exclude Ambiguous characters (l, I, 1, O, 0)
            if (excludeAmbiguous) {
                upperChars = upperChars.replace(/[IO]/g, '');
                lowerChars = lowerChars.replace(/[l]/g, '');
                numberChars = numberChars.replace(/[10]/g, '');
            }

            let availableChars = '';
            let requiredChars = [];

            if (incUpper) { availableChars += upperChars; requiredChars.push(upperChars[Math.floor(Math.random() * upperChars.length)]); }
            if (incLower) { availableChars += lowerChars; requiredChars.push(lowerChars[Math.floor(Math.random() * lowerChars.length)]); }
            if (incNumber) { availableChars += numberChars; requiredChars.push(numberChars[Math.floor(Math.random() * numberChars.length)]); }
            if (incSymbol) { availableChars += symbolChars; requiredChars.push(symbolChars[Math.floor(Math.random() * symbolChars.length)]); }

            if (availableChars === '') {
                passwordOutput.textContent = 'Select at least one option';
                updateStrength(0);
                return;
            }

            let passwordArray = [...requiredChars];
            for (let i = requiredChars.length; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * availableChars.length);
                passwordArray.push(availableChars[randomIndex]);
            }

            passwordArray = shuffleArray(passwordArray);
            if (passwordArray.length > length) passwordArray = passwordArray.slice(0, length);

            const finalPassword = passwordArray.join('');
            passwordOutput.textContent = finalPassword;
            
            resetCopyBtn();
            calculateStrength(finalPassword, incUpper, incLower, incNumber, incSymbol);
        }

        // ==========================================
        // MODE 2: PASSPHRASE (WORDS)
        // ==========================================
        function generatePassphrase() {
            const wordCount = parseInt(document.getElementById('wordCountSlider').value);
            const addNumber = document.getElementById('addNumberToWords').checked;
            const capitalize = document.getElementById('capitalizeWords').checked;

            let selectedWords = [];
            for (let i = 0; i < wordCount; i++) {
                const randomIndex = Math.floor(Math.random() * wordList.length);
                let word = wordList[randomIndex];
                if (capitalize) word = word.charAt(0).toUpperCase() + word.slice(1);
                selectedWords.push(word);
            }

            let finalPassword = selectedWords.join('-');

            if (addNumber) {
                finalPassword += '-' + Math.floor(Math.random() * 1000);
            }

            passwordOutput.textContent = finalPassword;
            resetCopyBtn();
            
            // Passphrase is usually long, so we call strength with basic length logic
            // For passphrase, length is high, variety is lower.
            calculateStrength(finalPassword, capitalize, !capitalize, addNumber, false);
        }

        // ==========================================
        // COMMON FUNCTIONS
        // ==========================================
        function calculateStrength(pwd, upper, lower, number, symbol) {
            if (pwd === 'Select at least one option') return;

            let strength = 0;
            if (pwd.length >= 8) strength += 1;
            if (pwd.length >= 12) strength += 1;
            if (pwd.length >= 16) strength += 1;
            
            if (upper && lower) strength += 1;
            if (number) strength += 1;
            if (symbol) strength += 1;

            let level = 0;
            if (strength <= 2) level = 1;
            else if (strength <= 4) level = 2;
            else if (strength <= 5) level = 3;
            else level = 4;

            strengthBars.forEach((bar, index) => {
                bar.className = 'strength-bar';
                if (index < level) {
                    if (level === 1) bar.classList.add('active-weak');
                    else if (level === 2) bar.classList.add('active-medium');
                    else bar.classList.add('active-strong');
                }
            });

            const textMap = { 1: 'Weak', 2: 'Medium', 3: 'Strong', 4: 'Very Strong' };
            strengthText.textContent = `Strength: ${textMap[level]}`;
            
            if (level === 1) strengthText.style.color = '#f5576c';
            else if (level === 2) strengthText.style.color = '#f5a623';
            else strengthText.style.color = '#43e97b';
        }

        function resetCopyBtn() {
            copyBtn.textContent = '📋 Copy';
            copyBtn.classList.remove('copied');
        }

        function copyPassword() {
            const pwd = passwordOutput.textContent;
            if (!pwd || pwd === 'Click Generate' || pwd === 'Select at least one option') return;

            navigator.clipboard.writeText(pwd).then(() => {
                copyBtn.textContent = '✅ Copied!';
                copyBtn.classList.add('copied');
                setTimeout(() => resetCopyBtn(), 2000);
            });
        }

        // Initial Generation on Load
        generatePassword();
    </script>
</body>
</html>
