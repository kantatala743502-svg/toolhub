<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter - ToolHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); min-height: 100vh; padding: 20px; display: flex; align-items: center; justify-content: center; }
        .container { background: #fff; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 700px; width: 100%; padding: 40px; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #fa709a; text-decoration: none; font-weight: 600; font-size: 0.95rem; }
        .back-btn:hover { text-decoration: underline; }
        h1 { color: #1a1a2e; font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 25px; font-size: 0.95rem; }
        
        textarea { width: 100%; padding: 15px; border: 2px solid #e0e0e8; border-radius: 12px; font-size: 1rem; font-family: inherit; resize: vertical; min-height: 180px; margin-bottom: 20px; }
        textarea:focus { outline: none; border-color: #fa709a; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; }
        .stat-card { background: #f8f9ff; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #e0e0e8; }
        .stat-value { font-size: 1.8rem; font-weight: 800; color: #fa709a; }
        .stat-label { font-size: 0.8rem; color: #666; margin-top: 5px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-btn">← Back to Tools</a>
        <h1>🔤 Word Counter</h1>
        <p class="subtitle">Count words, characters, sentences, and reading time</p>

        <textarea id="textInput" placeholder="Type or paste your text here..." oninput="updateStats()"></textarea>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="wordCount">0</div>
                <div class="stat-label">Words</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="charCount">0</div>
                <div class="stat-label">Characters</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="sentenceCount">0</div>
                <div class="stat-label">Sentences</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="readingTime">0m</div>
                <div class="stat-label">Reading Time</div>
            </div>
        </div>
    </div>

    <script>
        function updateStats() {
            const text = document.getElementById('textInput').value;
            
            // Words
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            document.getElementById('wordCount').textContent = words;
            
            // Characters
            document.getElementById('charCount').textContent = text.length;
            
            // Sentences
            const sentences = text.trim() ? text.split(/[.!?]+/).filter(s => s.trim().length > 0).length : 0;
            document.getElementById('sentenceCount').textContent = sentences;
            
            // Reading Time (Avg 200 words per min)
            const mins = Math.ceil(words / 200);
            document.getElementById('readingTime').textContent = (mins < 1 && words > 0 ? '<1' : mins) + 'm';
        }
    </script>
</body>
</html>
