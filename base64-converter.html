<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Encoder / Decoder - ToolHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #b721ff 0%, #21d4fd 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 750px;
            width: 100%;
            padding: 40px;
        }
        .back-btn {
            display: inline-block; margin-bottom: 20px; color: #b721ff;
            text-decoration: none; font-weight: 600; font-size: 0.95rem;
        }
        .back-btn:hover { text-decoration: underline; }
        h1 { color: #1a1a2e; font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 25px; font-size: 0.95rem; }

        /* Tabs */
        .tabs {
            display: flex; gap: 5px; margin-bottom: 20px; background: #f0f0f5; padding: 5px; border-radius: 10px;
        }
        .tab-btn {
            flex: 1; padding: 10px; border: none; background: none; font-weight: 600;
            color: #666; cursor: pointer; border-radius: 8px; transition: 0.3s; font-size: 1rem;
        }
        .tab-btn.active { background: #fff; color: #b721ff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .tool-panel { display: none; animation: fadeIn 0.4s; }
        .tool-panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { margin-bottom: 15px; }
        label { display: flex; justify-content: space-between; font-weight: 600; color: #333; margin-bottom: 8px; font-size: 0.95rem; }
        textarea {
            width: 100%; padding: 15px; border: 2px solid #e0e0e8; border-radius: 12px;
            font-size: 1rem; font-family: 'Courier New', Courier, monospace; resize: vertical; min-height: 120px;
            transition: border 0.3s; background: #f8f9ff;
        }
        textarea:focus { outline: none; border-color: #b721ff; background: #fff; }

        .action-row { display: flex; gap: 10px; margin-bottom: 20px; }
        button.main-btn {
            flex: 1; padding: 14px; background: linear-gradient(135deg, #b721ff, #21d4fd);
            color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: 0.2s;
        }
        button.main-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(183,33,255,0.3); }
        
        button.clear-btn {
            padding: 14px 20px; background: #f0f0f5; color: #666; border: none; border-radius: 10px;
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        button.clear-btn:hover { background: #e0e0e8; color: #333; }

        /* Result Box */
        .result-box {
            background: #f8f9ff; padding: 20px; border-radius: 12px; border: 2px dashed #b721ff;
            position: relative; display: none; margin-top: 15px;
        }
        .result-box.show { display: block; }
        .result-content {
            font-family: 'Courier New', Courier, monospace; font-size: 1rem; word-break: break-all;
            color: #1a1a2e; padding-right: 40px;
        }
        .copy-icon {
            position: absolute; top: 15px; right: 15px; background: #fff; border: 1px solid #e0e0e8;
            padding: 8px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; transition: 0.2s;
        }
        .copy-icon:hover { background: #b721ff; color: #fff; border-color: #b721ff; }
        .copy-icon.copied { background: #43e97b; color: #fff; border-color: #43e97b; }

    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-btn">← Back to Tools</a>
        <h1>🔡 Base64 Encoder / Decoder</h1>
        <p class="subtitle">Encode your text to Base64 or decode Base64 back to text</p>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('encode', event)">Encode (Text to Base64)</button>
            <button class="tab-btn" onclick="switchTab('decode', event)">Decode (Base64 to Text)</button>
        </div>

        <!-- ENCODE PANEL -->
        <div class="tool-panel active" id="encode-panel">
            <div class="form-group">
                <label>Enter Text to Encode:</label>
                <textarea id="encodeInput" placeholder="Type or paste your text here..." oninput="encodeBase64()"></textarea>
            </div>
            
            <div class="action-row">
                <button class="clear-btn" onclick="clearField('encodeInput', 'encodeResultBox')">Clear</button>
            </div>

            <div class="result-box" id="encodeResultBox">
                <div class="result-content" id="encodeResult"></div>
                <button class="copy-icon" id="copyEncodeBtn" onclick="copyResult('encodeResult', 'copyEncodeBtn')">📋</button>
            </div>
        </div>

        <!-- DECODE PANEL -->
        <div class="tool-panel" id="decode-panel">
            <div class="form-group">
                <label>Enter Base64 to Decode:</label>
                <textarea id="decodeInput" placeholder="Paste your Base64 string here..." oninput="decodeBase64()"></textarea>
            </div>
            
            <div class="action-row">
                <button class="clear-btn" onclick="clearField('decodeInput', 'decodeResultBox')">Clear</button>
            </div>

            <div class="result-box" id="decodeResultBox">
                <div class="result-content" id="decodeResult"></div>
                <button class="copy-icon" id="copyDecodeBtn" onclick="copyResult('decodeResult', 'copyDecodeBtn')">📋</button>
            </div>
        </div>

    </div>

    <script>
        // Tab Switching Logic
        function switchTab(tabName, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tool-panel').forEach(panel => panel.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`${tabName}-panel`).classList.add('active');
        }

        // ==========================================
        // ENCODE LOGIC
        // ==========================================
        function encodeBase64() {
            const input = document.getElementById('encodeInput').value;
            const resultBox = document.getElementById('encodeResultBox');
            const resultEl = document.getElementById('encodeResult');

            if (!input) {
                resultBox.classList.remove('show');
                return;
            }

            try {
                // btoa() is a built-in function for Base64 encoding
                // We use encodeURIComponent to handle Unicode characters (like Bengali)
                const encoded = btoa(unescape(encodeURIComponent(input)));
                resultEl.textContent = encoded;
                resultBox.classList.add('show');
            } catch (error) {
                resultEl.textContent = 'Error encoding text.';
                resultBox.classList.add('show');
            }
        }

        // ==========================================
        // DECODE LOGIC
        // ==========================================
        function decodeBase64() {
            const input = document.getElementById('decodeInput').value.trim();
            const resultBox = document.getElementById('decodeResultBox');
            const resultEl = document.getElementById('decodeResult');

            if (!input) {
                resultBox.classList.remove('show');
                return;
            }

            try {
                // atob() is a built-in function for Base64 decoding
                // We use decodeURIComponent to handle Unicode characters
                const decoded = decodeURIComponent(escape(atob(input)));
                resultEl.textContent = decoded;
                resultBox.classList.add('show');
            } catch (error) {
                resultEl.textContent = '❌ Invalid Base64 string. Please check your input.';
                resultBox.classList.add('show');
                resultEl.style.color = '#f5576c';
            }
        }

        // ==========================================
        // UTILITIES (Clear & Copy)
        // ==========================================
        function clearField(inputId, resultBoxId) {
            document.getElementById(inputId).value = '';
            document.getElementById(resultBoxId).classList.remove('show');
            // Reset error color
            const resultEl = document.getElementById(inputId.replace('Input', 'Result'));
            if(resultEl) resultEl.style.color = '#1a1a2e';
        }

        function copyResult(elementId, btnId) {
            const text = document.getElementById(elementId).textContent;
            if (!text || text.includes('Error') || text.includes('Invalid')) return;

            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById(btnId);
                btn.classList.add('copied');
                btn.textContent = '✅';
                
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.textContent = '📋';
                }, 2000);
            });
        }
    </script>
</body>
</html>
